# verify-publish — defense-in-depth gate that runs in the PUBLIC meko-skills
# repo on every pull request (including the automated publish PRs).
#
# This file is GENERATED into the public repo by the source-repo publish
# pipeline (scripts/publish-public-verify.yml -> .github/workflows/verify-publish.yml).
# Do not hand-edit it in the public repo — change it in meko-mcp-server.
#
# It re-checks the publication invariants WITHOUT needing source access or any
# token (publish-verify.mjs ships in the bundle), then re-runs the full security
# gate over the PR contents and validates the plugin manifest. Branch protection
# should require this job green before merge. Nothing here auto-merges.

name: verify-publish

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Re-check publication invariants (token-free, source-free)
        run: node scripts/publish-verify.mjs

      # Install and run the gitleaks BINARY directly rather than
      # gitleaks/gitleaks-action@v2 — the action requires a paid GITLEAKS_LICENSE
      # for organization repositories and would fail this token-free job. The
      # binary is Apache-2.0 and needs no license or token.
      - name: Secret scan (gitleaks)
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          CFG=""
          [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          /tmp/gitleaks dir . $CFG --no-banner --redact

      # trufflehog BINARY in filesystem mode. The trufflesecurity/trufflehog@main
      # ACTION is built for git diff scanning: it errors "BASE and HEAD are the
      # same" on a path and injects its own --fail (passing --fail again is a
      # duplicate-flag error). `filesystem ... --fail` exits non-zero on a
      # verified secret — token-free, no license.
      - name: Secret scan (trufflehog)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /tmp v3.90.10
          /tmp/trufflehog filesystem . --results=verified,unknown --fail --no-update

      - name: Prompt-injection lint
        run: |
          if [ -f scripts/prompt-injection-lint.mjs ]; then
            # Include public-only content such as extensions/bmad, not just the
            # paths owned by the source-repo courier.
            node scripts/prompt-injection-lint.mjs .
          else
            echo "::warning::prompt-injection-lint.mjs not bundled; invariant check still ran"
          fi

      - name: Validate plugin manifest
        # Validate BOTH the marketplace catalog at the root AND the nested
        # plugin directly. Root validation resolves the catalog/source but does
        # NOT recurse into the plugin manifest, so a strict violation inside
        # plugins/meko-agent-skills (e.g. an unknown `metadata` field) is only
        # caught by validating the nested plugin dir explicitly.
        run: |
          npx -y @anthropic-ai/claude-code plugin validate . --strict
          npx -y @anthropic-ai/claude-code plugin validate plugins/meko-agent-skills --strict

      - name: Check skill markdown links resolve
        run: node scripts/publish-verify.mjs
